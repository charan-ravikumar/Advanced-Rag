[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "advanced-rag"
version = "0.1.0"
description = "Hybrid RAG over Qasper: Chroma + SQLite FTS5 + weighted RRF, an LLM gateway, and a pre-registered evaluation"
requires-python = ">=3.13"  # every test and run so far used 3.13.14; 3.10-3.12 were never exercised

# Direct runtime imports of rag/, rag_core/, app/, db/, utils/ and the root modules (derived from the code in Week 1, Step 2).
# The exact, tested versions are in requirements.lock; the bounds here are the floors the code is known to need.
dependencies = [
    "chromadb>=1.5",                    # db/store.py
    "sentence-transformers>=5.0",       # rag/embedders.py, rag/rerankers.py (pulls torch and transformers)
    "scikit-learn>=1.3",                # rag/chunkers.py (cosine_similarity)
    "langchain-text-splitters>=1.0",    # rag/chunkers.py (the reference splitter, kept as the oracle for rag/splitting.py)
    "numpy>=2.0",                       # rag/embedders.py, eval/compare.py, eval/run_retrieval_eval.py
    "pandas>=2.2",                      # app/ui_evaluation.py, app/ui_observability.py
    "altair>=5.0",                      # app/ui_evaluation.py
    "streamlit>=1.40",                  # app/*
    "pydantic>=2.5",                    # rag_core/schemas.py, schemas.py
    "pyyaml>=6.0",                      # config.py
    "python-dotenv>=1.0",               # rag_core/env.py (allowlist loader)
    "huggingface-hub>=0.24",            # app/bootstrap.py (cache lookup, never a download)
    "openai>=1.109.1",                  # no longer used by rag_core/gateway.py (Gemini only); kept pinned so the lock file and the RAGAS environment are unchanged
    "google-genai>=1.0",                # rag_core/gateway.py (GeminiProvider), eval/ragas_adapter.py (the offline judge)
    "langfuse>=3.0",                    # rag_core/tracing.py, rag_core/langfuse_client.py
    "httpx>=0.27",                      # rag_core/observability_reader.py
]

[project.optional-dependencies]
# The HTTP API (api/): FastAPI + uvicorn. Required to RUN the API server; the Streamlit client needs only httpx (a core dependency).
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "slowapi>=0.1.9",                  # api/limits.py (per-key rate limiting; pulls in limits and deprecated)
    "httpx>=0.27",
]
# RAGAS scoring (eval/run_ragas.py, eval/ragas_adapter.py). Install ONLY into its own virtualenv: ragas needs openai < 3, which would
# downgrade the main environment (see requirements-eval.lock). Always set RAGAS_DO_NOT_TRACK=true before importing ragas.
eval = [
    "ragas==0.4.4",
    "instructor==1.17.0",   # ragas leaves it unpinned and the resolver picks a version without from_genai
    "jsonref",              # instructor needs it for Gemini
    "openai>=1.109.1,<3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
# An application layout (top-level packages, not a src/ tree): ship exactly the code and the config it reads next to config.py.
only-include = ["rag", "rag_core", "app", "api", "db", "eval", "utils", "observability", "config.py", "schemas.py", "config.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "model: needs the real embedding model in the local HuggingFace cache (skipped otherwise)",
    "slow: takes many seconds (torch import in a subprocess, real-model tests); skipped by --fast",
]
