[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "advanced-rag"
version = "0.1.0"
description = "Advanced RAG pipeline with semantic chunking, hybrid retrieval, and RRF fusion"
requires-python = ">=3.10"

dependencies = [
    # ── LLM clients ───────────────────────────────────────────
    "openai>=1.0,<2.0",
    "google-genai>=1.0",

    # ── Vector store ──────────────────────────────────────────
    "chromadb>=1.5",

    # ── Embeddings & retrieval ─────────────────────────────────
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2",
    "scikit-learn>=1.3",

    # ── Text splitting ─────────────────────────────────────────
    "langchain-text-splitters>=0.2",

    # ── Caching ────────────────────────────────────────────────
    "redis>=5.0",

    # ── API / serving ─────────────────────────────────────────
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "streamlit>=1.35",

    # ── Config / env ──────────────────────────────────────────
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",

    # ── Observability ─────────────────────────────────────────
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
    "prometheus-client>=0.17",
]

[project.optional-dependencies]
eval = [
    "datasets>=2.14",
    "ragas>=0.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
